name: Publish

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (preview package contents)
        required: false
        type: boolean
        default: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  stage:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main' || inputs.dry_run
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Validate tag version matches package.json
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $TAG_VERSION"
            exit 1
          fi

      - name: Preview package contents
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm pack --dry-run

      - name: Install npm CLI with staged publishing support
        if: github.event_name == 'push' || !inputs.dry_run
        run: npm install --global npm@11.21.3

      - name: Stage release for maintainer approval
        if: github.event_name == 'push' || !inputs.dry_run
        run: npm stage publish --access public
